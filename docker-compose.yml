version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: rakshak-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rakshak-net

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: rakshak-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - rakshak-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshak-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/rakshak_ai
      - JWT_SECRET=rakshak-ai-super-secret-jwt-key-prod-38491823
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
      - OSRM_URL=https://router.project-osrm.org
      - NOMINATIM_URL=https://nominatim.openstreetmap.org
      - ML_SERVICE_URL=http://ml-service:8000
      - EMERGENCY_NUMBER=112
    depends_on:
      - mongodb
      - ml-service
    networks:
      - rakshak-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rakshak-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - rakshak-net

volumes:
  mongo_data:

networks:
  rakshak-net:
    driver: bridge
